name: Monkeytail
options:
  bundleIdPrefix: co.kitta
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
packages:
  MonkeytailCore:
    path: .
  MonkeytailSystemCore:
    path: Packages/MonkeytailSystemCore
  MonkeytailWatchCore:
    path: Packages/MonkeytailWatchCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: 7P8CLHDH5G
    CODE_SIGN_STYLE: Automatic
targets:
  Monkeytail:
    type: application
    platform: iOS
    sources: [Monkeytail]
    dependencies:
      - package: MonkeytailCore
      - package: MonkeytailCore
        product: MonkeytailCompanion
      - target: MonkeytailWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.kitta.monkeytail
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Monkeytail
        INFOPLIST_KEY_CFBundleName: Monkeytail
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 'Connect to API servers and proxies on your local network.'
        MARKETING_VERSION: '1.4'
        CURRENT_PROJECT_VERSION: '60'
        CODE_SIGN_ENTITLEMENTS: Monkeytail/Monkeytail.entitlements
    info:
      path: Monkeytail/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleName: Monkeytail
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [monkeytail]
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: API Collection
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json, public.plain-text]
  MonkeytailMac:
    type: application
    platform: macOS
    sources:
      - path: Monkeytail
        excludes: [Info.plist, Monkeytail.entitlements]
    dependencies:
      - package: MonkeytailCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.kitta.monkeytail
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Monkeytail
        INFOPLIST_KEY_CFBundleName: Monkeytail
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        MARKETING_VERSION: '1.4'
        CURRENT_PROJECT_VERSION: '60'
        CODE_SIGN_ENTITLEMENTS: MonkeytailMac/Monkeytail.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        TARGETED_DEVICE_FAMILY: ''
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: MonkeytailMac/Debug.entitlements
    info:
      path: MonkeytailMac/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleName: Monkeytail
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Connect to API servers and proxies on your local network.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [monkeytail]
        CFBundleDocumentTypes:
          - CFBundleTypeName: API Collection
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json, public.yaml, public.plain-text]
  MonkeytailVision:
    type: application
    platform: visionOS
    deploymentTarget: '1.0'
    sources:
      - path: Monkeytail
        excludes: [Info.plist, Monkeytail.entitlements, Assets.xcassets]
      - path: MonkeytailVision/Assets.xcassets
    dependencies:
      - package: MonkeytailSystemCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.kitta.monkeytail
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Monkeytail
        INFOPLIST_KEY_CFBundleName: Monkeytail
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to API servers and proxies on your local network.
        MARKETING_VERSION: '1.4'
        CURRENT_PROJECT_VERSION: '60'
        CODE_SIGN_ENTITLEMENTS: MonkeytailVision/Monkeytail.entitlements
        TARGETED_DEVICE_FAMILY: '7'
    info:
      path: MonkeytailVision/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleName: Monkeytail
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [monkeytail]
        CFBundleDocumentTypes:
          - CFBundleTypeName: API Collection
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json, public.yaml, public.plain-text]
  MonkeytailWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources: [MonkeytailWatch]
    dependencies:
      - package: MonkeytailWatchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.kitta.monkeytail.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Monkeytail
        INFOPLIST_KEY_CFBundleName: Monkeytail
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: co.kitta.monkeytail
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        MARKETING_VERSION: '1.4'
        CURRENT_PROJECT_VERSION: '60'
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
    info:
      path: MonkeytailWatch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleName: Monkeytail
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  MonkeytailVisionUITests:
    type: bundle.ui-testing
    platform: visionOS
    deploymentTarget: '1.0'
    sources: [MonkeytailVisionUITests]
    dependencies:
      - target: MonkeytailVision
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '7'
  MonkeytailWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: '10.0'
    sources: [MonkeytailWatchUITests]
    dependencies:
      - target: MonkeytailWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '4'
  MonkeytailMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MonkeytailMacTests]
    dependencies:
      - target: MonkeytailMac
      - package: MonkeytailCore
        product: MonkeytailCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MonkeytailTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - MonkeytailTests
      - MonkeytailMacTests/AdvancedIntegrationTests.swift
    dependencies:
      - target: Monkeytail
  MonkeytailUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources: [MonkeytailUITests]
    dependencies:
      - target: Monkeytail
schemes:
  Monkeytail:
    build:
      targets:
        Monkeytail: all
    test:
      targets:
        - name: MonkeytailTests
          parallelizable: false
        - name: MonkeytailUITests
          parallelizable: false

  MonkeytailMac:
    build:
      targets:
        MonkeytailMac: all
    test:
      targets:
        - name: MonkeytailMacTests
          parallelizable: false

  MonkeytailVision:
    build:
      targets:
        MonkeytailVision: all
    test:
      targets: [MonkeytailVisionUITests]

  MonkeytailWatch:
    build:
      targets:
        MonkeytailWatch: all
    test:
      targets: [MonkeytailWatchUITests]
