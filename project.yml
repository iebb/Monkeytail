name: Monkeytail
options:
  bundleIdPrefix: co.kitta
  deploymentTarget:
    iOS: '17.0'
packages:
  MonkeytailCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: 7P8CLHDH5G
    CODE_SIGN_STYLE: Automatic
targets:
  Monkeytail:
    type: application
    platform: iOS
    sources: [Monkeytail]
    dependencies:
      - package: MonkeytailCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.kitta.monkeytail
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Monkeytail
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 'Connect to API servers and proxies on your local network.'
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
    info:
      path: Monkeytail/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: API Collection
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json, public.plain-text]
  MonkeytailTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources: [MonkeytailTests]
    dependencies:
      - target: Monkeytail
  MonkeytailUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources: [MonkeytailUITests]
    dependencies:
      - target: Monkeytail
schemes:
  Monkeytail:
    build:
      targets:
        Monkeytail: all
    test:
      targets:
        - name: MonkeytailTests
          parallelizable: false
        - name: MonkeytailUITests
          parallelizable: false
