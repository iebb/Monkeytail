name: Monkeytail
options:
  bundleIdPrefix: co.kitta
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
packages:
  MonkeytailCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: 7P8CLHDH5G
    CODE_SIGN_STYLE: Automatic
targets:
  Monkeytail:
    type: application
    platform: iOS
    sources: [Monkeytail]
    dependencies:
      - package: MonkeytailCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.kitta.monkeytail
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Monkeytail
        INFOPLIST_KEY_CFBundleName: Monkeytail
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 'Connect to API servers and proxies on your local network.'
        MARKETING_VERSION: '1.2'
        CURRENT_PROJECT_VERSION: '15'
        CODE_SIGN_ENTITLEMENTS: Monkeytail/Monkeytail.entitlements
    info:
      path: Monkeytail/Info.plist
      properties:
        CFBundleName: Monkeytail
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [monkeytail]
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: API Collection
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json, public.plain-text]
  MonkeytailMac:
    type: application
    platform: macOS
    sources:
      - path: Monkeytail
        excludes: [Info.plist, Monkeytail.entitlements]
    dependencies:
      - package: MonkeytailCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.kitta.monkeytail
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Monkeytail
        INFOPLIST_KEY_CFBundleName: Monkeytail
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        MARKETING_VERSION: '1.2'
        CURRENT_PROJECT_VERSION: '15'
        CODE_SIGN_ENTITLEMENTS: MonkeytailMac/Monkeytail.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        TARGETED_DEVICE_FAMILY: ''
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: MonkeytailMac/Debug.entitlements
    info:
      path: MonkeytailMac/Info.plist
      properties:
        CFBundleName: Monkeytail
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Connect to API servers and proxies on your local network.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [monkeytail]
        CFBundleDocumentTypes:
          - CFBundleTypeName: API Collection
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json, public.yaml, public.plain-text]
  MonkeytailMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MonkeytailMacTests]
    dependencies:
      - target: MonkeytailMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MonkeytailTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - MonkeytailTests
      - MonkeytailMacTests/AdvancedIntegrationTests.swift
    dependencies:
      - target: Monkeytail
  MonkeytailUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources: [MonkeytailUITests]
    dependencies:
      - target: Monkeytail
schemes:
  Monkeytail:
    build:
      targets:
        Monkeytail: all
    test:
      targets:
        - name: MonkeytailTests
          parallelizable: false
        - name: MonkeytailUITests
          parallelizable: false

  MonkeytailMac:
    build:
      targets:
        MonkeytailMac: all
    test:
      targets:
        - name: MonkeytailMacTests
          parallelizable: false
