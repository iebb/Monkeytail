name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect (TestFlight)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
env:
  UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
jobs:
  archive:
    name: Archive ${{ matrix.platform }}
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            scheme: Monkeytail
            destination: generic/platform=iOS
            asc_platform: IOS
          - platform: macOS
            scheme: MonkeytailMac
            destination: generic/platform=macOS
            asc_platform: MAC_OS
          - platform: visionOS
            scheme: MonkeytailVision
            destination: generic/platform=visionOS
            asc_platform: VISION_OS
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Check release metadata
        run: python3 Scripts/verify_release.py
      - name: Prepare signing
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          # Offset past earlier manual uploads (up to 1003); Mac builds must exceed every previous Mac build.
          echo "BUILD_NUMBER=$(( $(git rev-list --count HEAD) + 1000 ))" >> "$GITHUB_ENV"
          if [[ -n "$SIGNING_CERTIFICATE_P12" ]]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            keychain_password=$(uuidgen)
            printf '%s' "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$RUNNER_TEMP/signing.p12" -P "$SIGNING_CERTIFICATE_PASSWORD" \
              -A -t cert -f pkcs12 -k "$keychain"
            security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          fi
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive -project Monkeytail.xcodeproj -scheme "${{ matrix.scheme }}" \
            -configuration Release -destination "${{ matrix.destination }}" \
            -archivePath "$RUNNER_TEMP/${{ matrix.scheme }}.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
      - name: Notarize Developer ID app
        id: developer_id
        if: matrix.platform == 'macOS' && env.UPLOAD == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if ! security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
            echo "::warning::SIGNING_CERTIFICATE_P12 has no Developer ID Application identity, so no GitHub release is made"
            exit 0
          fi
          plutil -create xml1 "$RUNNER_TEMP/DeveloperID.plist"
          plutil -insert method -string developer-id "$RUNNER_TEMP/DeveloperID.plist"
          plutil -insert teamID -string 7P8CLHDH5G "$RUNNER_TEMP/DeveloperID.plist"
          plutil -insert signingStyle -string automatic "$RUNNER_TEMP/DeveloperID.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/${{ matrix.scheme }}.xcarchive" \
            -exportPath "$RUNNER_TEMP/developer-id" -exportOptionsPlist "$RUNNER_TEMP/DeveloperID.plist" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          app="$RUNNER_TEMP/developer-id/Monkeytail.app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$ASC_KEY_PATH" \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --output-format json \
            > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          if [[ "$(plutil -extract status raw "$RUNNER_TEMP/notary.json")" != Accepted ]]; then
            xcrun notarytool log "$(plutil -extract id raw "$RUNNER_TEMP/notary.json")" --key "$ASC_KEY_PATH" \
              --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            exit 1
          fi
          xcrun stapler staple "$app"
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$app/Contents/Info.plist")
          mkdir -p "$RUNNER_TEMP/release"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/release/Monkeytail-$version-$BUILD_NUMBER-macOS.zip"
          echo "v$version-$BUILD_NUMBER" > "$RUNNER_TEMP/release/tag.txt"
          echo "Monkeytail $version ($BUILD_NUMBER)" > "$RUNNER_TEMP/release/title.txt"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Keep Developer ID app
        if: steps.developer_id.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: developer-id-macOS
          path: ${{ runner.temp }}/release
          retention-days: 1
      - name: Export
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          destination=export
          [[ "$UPLOAD" == "true" ]] && destination=upload
          plutil -create xml1 "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert method -string app-store-connect "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert destination -string "$destination" "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert teamID -string 7P8CLHDH5G "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert signingStyle -string automatic "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/${{ matrix.scheme }}.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Record upload
        if: env.UPLOAD == 'true'
        run: echo "$BUILD_NUMBER" > "$RUNNER_TEMP/uploaded.txt"
      - name: Mark upload for TestFlight
        if: env.UPLOAD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-${{ matrix.asc_platform }}
          path: ${{ runner.temp }}/uploaded.txt
          retention-days: 1
      - name: Keep exported package
        if: env.UPLOAD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Monkeytail-${{ matrix.platform }}-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/export
          if-no-files-found: error
      - name: Clean up signing
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/signing.p12"
  testflight:
    name: TestFlight ${{ matrix.platform }}
    needs: archive
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.upload) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [IOS, MAC_OS, VISION_OS]
    steps:
      - name: Check upload
        id: uploaded
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: uploaded-${{ matrix.platform }}
          path: ${{ runner.temp }}/uploaded
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.uploaded.outcome == 'success'
      - uses: actions/setup-python@v5
        if: steps.uploaded.outcome == 'success'
        with:
          python-version: '3.13'
      - name: Install dependencies
        if: steps.uploaded.outcome == 'success'
        run: pip install 'pyjwt[crypto]'
      - name: Submit to public TestFlight
        if: steps.uploaded.outcome == 'success'
        env:
          APP_ID: '6814706725'
          PLATFORM: ${{ matrix.platform }}
          BETA_GROUP: ${{ vars.BETA_GROUP || 'Public' }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          export BUILD_NUMBER="$(cat "$RUNNER_TEMP/uploaded/uploaded.txt")"
          export WHATS_NEW="$(git log -1 --format=%B)"
          python3 Scripts/testflight_submit.py
  release:
    name: GitHub release
    needs: archive
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.upload) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check Developer ID app
        id: app
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: developer-id-macOS
          path: ${{ runner.temp }}/release
      - name: Publish macOS app
        if: steps.app.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/release"
          tag=$(cat tag.txt)
          gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq .commit.message > notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" Monkeytail-*-macOS.zip --clobber
          else
            gh release create "$tag" Monkeytail-*-macOS.zip --target "$GITHUB_SHA" \
              --title "$(cat title.txt)" --notes-file notes.md
          fi
