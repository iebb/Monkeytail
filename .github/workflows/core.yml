name: Core tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check release metadata
        run: python3 Scripts/verify_release.py
      - name: Test Swift core
        run: swift test
      - name: Test native Mac app
        run: |
          python3 ci_scripts/fixture_server.py > /tmp/monkeytail-fixtures.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          xcodebuild -project Monkeytail.xcodeproj -scheme MonkeytailMac \
            -configuration Debug -destination 'platform=macOS' -jobs 4 \
            -derivedDataPath /tmp/MonkeytailCI -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES test
